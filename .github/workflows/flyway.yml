# ===========================
# Flyway sandbox pipeline for GitHub Actions (self-hosted Windows runner)
# Based on Flyway AutoPilot: https://github.com/red-gate/Flyway-AutoPilot-BackUp
#
# To run, this file must be at .github/workflows/flyway.yml (see pipelines/github-actions/README.md).
# Runs when a change to migrations/ reaches main, or from Actions > Flyway > Run workflow.
#   1. Check:  a report built on the Check database: changes, drift on Test, code review, SQL to run.
#   2. Deploy: applies pending migrations to Test and saves a snapshot for the next drift check.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   FLYWAY_EMAIL, FLYWAY_TOKEN    your Redgate account email and a personal access token:
#     https://documentation.red-gate.com/flyway/flyway-cli-and-api/tutorials/tutorial-personal-access-tokens
#   TARGET_DATABASE_USERNAME, TARGET_DATABASE_PASSWORD    only for a SQL or database login
#     (left unset, Windows sign-in is used)
# Optional: add required reviewers to the "test" environment (Settings > Environments) so the
# deployment waits for someone to read the report.
# ===========================

name: Flyway

on:
  push:
    branches: [ main ]
    paths: [ 'migrations/**' ]
  workflow_dispatch:

env:
  FLYWAY_EMAIL: ${{ secrets.FLYWAY_EMAIL }}
  FLYWAY_TOKEN: ${{ secrets.FLYWAY_TOKEN }}
  TARGET_DATABASE_USERNAME: ${{ secrets.TARGET_DATABASE_USERNAME }}
  TARGET_DATABASE_PASSWORD: ${{ secrets.TARGET_DATABASE_PASSWORD }}
  FLYWAY_CLI_INSTALL_CHECK: 'false'      # 'true' installs the Flyway CLI on the runner if it's missing
  FLYWAY_INSTALL_DIRECTORY: 'C:\FlywayCLI'

defaults:
  run:
    shell: powershell

jobs:
  check:
    name: Check (report on the Check database)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Flyway CLI - install check (optional)
        if: env.FLYWAY_CLI_INSTALL_CHECK == 'true'
        run: |
          & .\Scripts\Flyway_DownloadAndInstallCLI.ps1
          $env:FLYWAY_INSTALL_DIRECTORY | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Flyway authentication
        run: flyway auth -IAgreeToTheEula "-email=$env:FLYWAY_EMAIL" "-token=$env:FLYWAY_TOKEN"

      # Test and Check are environment names in flyway.toml
      - name: Check report
        run: flyway check -dryrun -changes -drift -code -environment=Test "-user=$env:TARGET_DATABASE_USERNAME" "-password=$env:TARGET_DATABASE_PASSWORD" "-check.buildEnvironment=Check" "-environments.Check.user=$env:TARGET_DATABASE_USERNAME" "-environments.Check.password=$env:TARGET_DATABASE_PASSWORD" "-reportFilename=reports/Test-check.html"

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flyway-report-test
          path: reports/
          if-no-files-found: ignore

  deploy:
    name: Deploy to Test
    needs: check
    runs-on: self-hosted
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Flyway CLI - install check (optional)
        if: env.FLYWAY_CLI_INSTALL_CHECK == 'true'
        run: |
          & .\Scripts\Flyway_DownloadAndInstallCLI.ps1
          $env:FLYWAY_INSTALL_DIRECTORY | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Flyway authentication
        run: flyway auth -IAgreeToTheEula "-email=$env:FLYWAY_EMAIL" "-token=$env:FLYWAY_TOKEN"

      - name: Migrate Test
        run: flyway info migrate info -environment=Test "-user=$env:TARGET_DATABASE_USERNAME" "-password=$env:TARGET_DATABASE_PASSWORD" "-migrate.saveSnapshot=true"
